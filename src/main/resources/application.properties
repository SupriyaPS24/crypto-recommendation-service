spring.application.name=crypto-recommendation-service

#spring.datasource.url=jdbc:h2:file:./data/cryptodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.url=jdbc:h2:mem:cryptodb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Enable H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# === Logging ===
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.xm=DEBUG
logging.level.org.springdoc=DEBUG

# === CSV Data Path ===
data.csv-path=src/main/resources/data

# === Supported Crypto Symbols ===
data.supported-symbols=BTC,ETH,XRP,LTC,DOGE

# === Swagger ===
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# === Rate Limiting ===
ratelimit.requestsPerMinute=100